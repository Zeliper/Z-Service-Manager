[package]
name = "zsm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
log = "0.4.34"
portable-pty = "0.9.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
vte = "0.15.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Shutdown"] }
